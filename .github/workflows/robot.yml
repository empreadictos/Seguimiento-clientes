name: Mi Robot Extractor

on:
  workflow_dispatch: # Esto nos crea un botón para encenderlo manualmente ahora mismo
  schedule:
    - cron: '0 13 * * *' # Esto es el despertador: Todos los días a las 13:00 UTC (8:00 AM en Colombia)

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest # GitHub nos presta un computador con Linux gratis
    
    steps:
      - name: Traer los archivos
        uses: actions/checkout@v4
      
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: ¡Despertar al Robot!
        run: python extractor.py
